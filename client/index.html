<!DOCTYPE html>
<html lang="en">
<head>
    <title>MCQ Quiz App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Online MCQ Quiz</h1>

</div>

<script src="script.js"></script>

</body>
</html>
